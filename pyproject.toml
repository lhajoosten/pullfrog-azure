[project]
name = "pullfrog-azure-workspace"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1,<2",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/control-plane"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/control-plane/tests"]
markers = ["integration: requires PostgreSQL"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
packages = ["pullfrog_azure_api"]
mypy_path = ["apps/control-plane/src"]
